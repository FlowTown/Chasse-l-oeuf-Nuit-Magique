<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chasse à l'œuf magique</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <img src="assets/logo-nm-gold.png" alt="La Nuit Magique" class="logo" />

      <p class="badge">Concours de Pâques</p>

      <h1>Chasse à l'œuf magique</h1>

      <p class="intro">
        Renseigne ton email, accepte la newsletter, puis lance le tirage.
        Un œuf magique sortira du nid pour révéler ton lot.
      </p>

      <p id="qr-status" class="qr-status"></p>

      <div class="form-block">
        <input
          type="email"
          id="email"
          placeholder="Ton adresse email"
          autocomplete="email"
        />

        <label class="check-row">
          <input type="checkbox" id="newsletter" />
          <span>J’accepte de m’inscrire à la newsletter</span>
        </label>

        <button id="play-btn">Lancer le tirage</button>

        <p id="form-status" class="form-status"></p>
      </div>

      <div class="nest-zone">
        <div id="nest" class="nest">
          <img src="assets/nest.png" alt="Nid" class="nest-image" />

          <div class="eggs-layer">
            <img src="assets/red-egg.png" alt="Œuf rouge" class="egg egg-1" data-color="red" />
            <img src="assets/green-egg.png" alt="Œuf vert" class="egg egg-2" data-color="green" />
            <img src="assets/blue-egg.png" alt="Œuf bleu" class="egg egg-3" data-color="blue" />
            <img src="assets/gold-egg.png" alt="Œuf or" class="egg egg-4" data-color="gold" />
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="flash-layer" class="flash-layer"></div>

  <div id="win-overlay" class="win-overlay hidden">
    <div class="win-backdrop"></div>

    <div id="fx-layer" class="fx-layer">
      <div class="sparkles sparkle-a"></div>
      <div class="sparkles sparkle-b"></div>
      <div class="sparkles sparkle-c"></div>

      <div class="firework firework-1"></div>
      <div class="firework firework-2"></div>
      <div class="firework firework-3"></div>
    </div>

    <div class="win-stage">
      <img id="flying-egg" class="flying-egg hidden" src="" alt="Œuf gagnant" />

      <div id="win-card" class="win-card hidden">
        <p class="win-badge">Félicitations</p>
        <h2 id="result-title">Bravo !</h2>
        <p id="result-text" class="win-text"></p>
        <button id="close-win-btn" class="close-win-btn">Continuer</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    window.supabase = createClient(
      'https://TON-PROJET.supabase.co',
      'TA_PUBLISHABLE_KEY'
    );
  </script>

  <script src="script.js"></script>
</body>
</html>
